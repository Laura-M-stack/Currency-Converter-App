<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency converter – Laura Moyano</title>
    <meta name="description" content="Fast, multilingual currency converter with live exchange rates, 160+ currencies and light/dark mode." />
    <meta name="theme-color" content="#efeee9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://open.er-api.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />

    <!--
      Applies the theme before the first paint to avoid a light flash in dark mode.
      Keep in sync with savedTheme() in src/lib/settings.svelte.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cc:theme');
          if (t !== 'light' && t !== 'dark') {
            var legacy = localStorage.getItem('darkMode');
            t = legacy === 'true' ? 'dark' : legacy === 'false' ? 'light'
              : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript to fetch exchange rates.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
